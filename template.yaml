id: eventos-bodas
nombre: Bodas y eventos
descripcion: Web romántica para wedding planners, fincas, fotógrafos y catering de bodas, con packs y galería.
sectores: [bodas, eventos, wedding-planner, fotografia-bodas, catering, espacios]
secciones:
  - { id: hero, nombre: Portada }
  - { id: servicios, nombre: Servicios }
  - { id: galeria, nombre: Galería }
  - { id: packs, nombre: Packs y precios }
  - { id: proceso, nombre: Cómo trabajamos }
  - { id: opiniones, nombre: Opiniones }
  - { id: preguntas, nombre: Preguntas frecuentes }
  - { id: contacto, nombre: Contacto }
estilo: romantico
plan_minimo: presencia
version: 1.1.0
base: astrowind
demo_url: https://demo-plantilla-eventos-bodas.noexpertise.com
activa: true
orden: 160

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu negocio"
    pregunta: "¿Cómo se llama tu negocio y qué eventos organizáis?"
    ayuda: "Bodas, comuniones, empresa… y qué hacéis: organización, fotografía, catering, espacio."
    tipo: texto
    campos: [nombre, eslogan, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto, seo.descripcion]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde estáis y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.instagram, redes.facebook]
  - id: servicios
    titulo: "Tus servicios"
    pregunta: "¿Qué servicios ofrecéis? Uno por línea."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.servicios.items]
  - id: packs
    titulo: "Packs y precios"
    pregunta: "¿Tenéis packs? Nombre, qué incluye y el precio si quieres. Uno por línea."
    ayuda: "Si preferís dar precio a medida, salta este paso."
    tipo: lista
    campos: [secciones.packs.packs]
  - id: proceso
    titulo: "Cómo trabajáis"
    pregunta: "¿Cómo es organizar un evento con vosotros, paso a paso?"
    tipo: texto
    campos: [secciones.proceso.titulo, secciones.proceso.items]
  - id: preguntas
    titulo: "Preguntas frecuentes"
    pregunta: "¿Qué os preguntan más a menudo? Escribe cada pregunta y lo que respondéis."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.preguntas.preguntas]
  - id: consulta
    titulo: "Pedir información"
    pregunta: "¿Qué tipos de evento os pueden pedir desde el formulario?"
    tipo: texto
    campos: [secciones.contacto.titulo, secciones.contacto.texto, secciones.contacto.tipos_evento]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada y, si quieres, alguna más."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.galeria.galeria, secciones.contacto.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
