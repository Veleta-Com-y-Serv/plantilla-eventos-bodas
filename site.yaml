      - { nombre: Organización parcial, precio: "desde 2.400 €", texto: "Os ayudamos a elegir y a cerrar lo importante, y nos ocupamos del día.", incluye: "Búsqueda de espacio y proveedores; Presupuesto y seguimiento; Diseño de la decoración; Ensayo de la ceremonia; Dos coordinadoras el día de la boda", destacado: true }
