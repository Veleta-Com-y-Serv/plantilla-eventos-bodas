      - { titulo: Diseñamos juntos, texto: "Decoración, música y cronograma, paso a paso y sin agobios." }
      - { titulo: Lo coordinamos todo, texto: "El día de la boda estamos allí desde el montaje hasta el final." }

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que cuentan las parejas
    testimonios:
      - { texto: "No tuvimos que preocuparnos de nada. Cada vez que mirábamos a nuestro alrededor, todo estaba en su sitio.", autor: Marta y Daniel, nota: "Boda en una finca de La Granja, junio de 2025" }
      - { texto: "Nos ayudaron a encontrar un patio precioso en el centro y a ajustar el presupuesto sin renunciar a lo que queríamos.", autor: Lucía y Andrés, nota: "Boda civil en Segovia, septiembre de 2025" }
      - { texto: "Vivimos fuera y lo organizamos casi todo a distancia. Estuvieron siempre localizables y fueron muy claras.", autor: Elena y Sergio, nota: "Boda en Pedraza, mayo de 2024" }
      - { texto: "La decoración fue exactamente lo que habíamos imaginado: sencilla, con flores del campo y velas.", autor: Carmen e Iván, nota: "Boda en una ermita románica, octubre de 2024" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos suelen preguntar
    preguntas:
      - { pregunta: "¿Con cuánta antelación debemos contactar?", respuesta: "Lo ideal es entre doce y dieciocho meses antes, sobre todo para fechas de primavera y verano. Para coordinación del día, con tres meses basta." }
      - { pregunta: "¿Trabajáis fuera de Segovia?", respuesta: "Sí. Trabajamos en toda la provincia y en Madrid, Ávila y Valladolid. Fuera de ahí, consultadnos." }
      - { pregunta: "¿Podemos elegir nuestros propios proveedores?", respuesta: "Claro. Os recomendamos los que conocemos, pero coordinamos encantadas a los que ya tengáis." }
      - { pregunta: "¿Organizáis también comuniones y eventos de empresa?", respuesta: "Sí, con el mismo cuidado: comuniones, aniversarios, cenas de empresa y presentaciones." }
      - { pregunta: "¿Cómo se paga?", respuesta: "Una señal al firmar, un segundo pago a mitad de la organización y el resto la semana anterior al evento." }

